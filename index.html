<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scudetto | Simulador de Modo Manager DT Online</title>
  <meta name="description" content="Scudetto es un simulador gratuito de modo manager de fútbol: armá tu equipo, elegí la táctica y dirigí tu temporada como DT online.">
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
    main { max-width: 700px; margin: auto; background: #1e293b; padding: 24px; border-radius: 12px; }
    h1 { color: #38bdf8; margin-top: 0; }
    input, select, button { padding: 10px; border-radius: 8px; border: none; font-size: 16px; }
    button { background: #38bdf8; color: #06263a; font-weight: bold; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 8px; border-bottom: 1px solid #334155; text-align: left; }
    #resultado { margin-top: 16px; font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>Scudetto</h1>
    <p>Simulador de Modo Manager DT Online</p>

    <label>Nombre de tu club:</label><br>
    <input id="club" placeholder="Ej: Scudetto FC"><br><br>

    <label>Formación:</label><br>
    <select id="formacion">
      <option value="4-4-2">4-4-2 — Equilibrado</option>
      <option value="4-3-3">4-3-3 — Más ataque</option>
      <option value="5-3-2">5-3-2 — Más defensa</option>
    </select><br><br>

    <button onclick="simularPartido()">Jugar partido</button>
    <button onclick="reiniciar()">Reiniciar temporada</button>

    <div id="resultado"></div>

    <h2>Tabla</h2>
    <table>
      <thead>
        <tr><th>Club</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>Pts</th></tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>
  </main>

  <script>
    const rivales = ["Rivers Plate", "Boca Unidos", "Central Norte", "Atlético Sur", "Dep. Norte", "Unión FC"];
    let equipos = [];

    function crearEquipo(nombre) {
      return { nombre, pj: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0, pts: 0 };
    }

    function reiniciar() {
      const nombre = document.getElementById("club").value.trim() || "Scudetto FC";
      equipos = [crearEquipo(nombre), ...rivales.map(crearEquipo)];
      document.getElementById("resultado").textContent = "";
      mostrarTabla();
    }

    function simularPartido() {
      if (!equipos.length) reiniciar();

      const formacion = document.getElementById("formacion").value;
      const bonus = formacion === "4-3-3" ? 0.4 : formacion === "5-3-2" ? -0.2 : 0;

      const miEquipo = equipos[0];
      const rival = equipos[1 + Math.floor(Math.random() * rivales.length)];

      let golesMios = Math.max(0, Math.round(Math.random() * 3 + bonus));
      let golesRival = Math.max(0, Math.round(Math.random() * 3));

      actualizar(miEquipo, golesMios, golesRival);
      actualizar(rival, golesRival, golesMios);

      document.getElementById("resultado").textContent =
        `${miEquipo.nombre} ${golesMios} - ${golesRival} ${rival.nombre}`;

      mostrarTabla();
    }

    function actualizar(e, gf, gc) {
      e.pj++;
      e.gf += gf;
      e.gc += gc;
      if (gf > gc) { e.g++; e.pts += 3; }
      else if (gf === gc) { e.e++; e.pts += 1; }
      else { e.p++; }
    }

    function mostrarTabla() {
      equipos.sort((a, b) => b.pts - a.pts || (b.gf - b.gc) - (a.gf - a.gc));
      document.getElementById("tabla").innerHTML = equipos.map(e => `
        <tr>
          <td>${e.nombre}</td>
          <td>${e.pj}</td><td>${e.g}</td><td>${e.e}</td><td>${e.p}</td>
          <td>${e.gf}</td><td>${e.gc}</td><td><b>${e.pts}</b></td>
        </tr>
      `).join("");
    }

    reiniciar();
  </script>
</body>
</html>
